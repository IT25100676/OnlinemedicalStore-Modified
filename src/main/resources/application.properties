spring.application.name=MedStore Order Module
server.port=8080

# ?? File-based storage (legacy flat-file layer) ???????????????????????????????
app.data.dir=./data

# ?? MySQL DataSource ??????????????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/online_medical_store\
  ?createDatabaseIfNotExist=true\
  &useSSL=false\
  &serverTimezone=UTC\
  &characterEncoding=UTF-8\
  &allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=Sandeepa1292
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? Connection pool (HikariCP ? Spring Boot default) ?????????????????????????
spring.datasource.hikari.pool-name=MedStorePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ?? JPA / Hibernate (add this if you later migrate from file repo to JPA) ?????
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ?? Thymeleaf ?????????????????????????????????????????????????????????????????
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8